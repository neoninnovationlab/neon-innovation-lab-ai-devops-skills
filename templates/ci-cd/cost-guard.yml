name: Cloud Cost & IaC Guard

on:
  pull_request:
    paths:
      - '**.tf'
      - '**.tf.json'

jobs:
  cost-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Terraform Cost Smell Scanner
        run: |
          python3 .github/scripts/tf-cost-scanner.py .
