name: Database Migration Lock Guard

on:
  pull_request:
    paths:
      - '**.sql'
      - 'prisma/migrations/**'
      - 'alembic/versions/**'

jobs:
  migration-lock-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Postgres Lock Safety Scanner
        run: |
          python3 .github/scripts/lock-analyzer.py .
